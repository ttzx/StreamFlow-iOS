name: StreamFlow
options:
  bundleIdPrefix: com.streamflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  StreamFlow:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        UILaunchScreen: {}
        # 侧载后需连局域网 NAS（http://IP:8180）；IP 直连本身不受 ATS 限制，
        # 此项兜底覆盖主机名形态
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  StreamFlow:
    build:
      targets:
        StreamFlow: all
