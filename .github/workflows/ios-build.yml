# StreamFlow-iOS CI：编译冒烟 + 无签名 IPA 产物。
# 公开仓标准 GitHub 托管 Runner 免费（含 macOS，macos-15 为标准标签，
# 不使用 large/xlarge 付费规格）；私有主仓保持 Private，server/ 不在本仓库。
# 集成测试套件依赖真实 FastAPI 服务端，位于私有主仓 ios/Tests，不随本仓库分发。
name: ios-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # GITHUB_TOKEN 只读

# 并发去重：同一分支快速连推时取消旧 run，避免重复构建消耗
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (simulator, no signing)
        run: |
          xcodebuild -project StreamFlow.xcodeproj -scheme StreamFlow \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build (device, unsigned, Release)
        run: |
          xcodebuild -project StreamFlow.xcodeproj -scheme StreamFlow \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package unsigned .ipa
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::未找到 .app 产物"; exit 1; }
          APPNAME=$(basename "$APP")
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          # 版本号用 CI Run ID 递增：侧载工具对「同 bundle id 同版本」的更新安装
          # 处理不可靠（实测 3639c83 可装、同结构 213a52d 失败），递增 build number
          # 让其走标准更新路径
          PLIST="Payload/$APPNAME/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_ID}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" "$PLIST"
          zip -qry StreamFlow-unsigned.ipa Payload
          echo "== 产物自检 =="
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "Payload/$APPNAME/Info.plist")
          file "Payload/$APPNAME/$EXEC"
          lipo -info "Payload/$APPNAME/$EXEC"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :MinimumOSVersion' \
            "Payload/$APPNAME/Info.plist"
          ls -la StreamFlow-unsigned.ipa

      - name: Upload unsigned .ipa（侧载用，自行签名安装）
        uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-unsigned-ipa
          path: ios/StreamFlow-unsigned.ipa
          if-no-files-found: error
